apiVersion: devloop/v1
kind: Config

customActions:
  - name: update-infra
    executionMode:
      kubernetesCluster: {} # <- Indicates Devloop to run the action with K8s jobs.
    containers:
      - name: update-db-schema
        image: gcr.io/my-registry/db-updater:latest
      - name: setup-external-proxy
        image: gcr.io/my-registry/proxy:latest