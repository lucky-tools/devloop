apiVersion: devloop/v1
kind: Config
profiles:
  - name: deployment
    manifests:
      rawYaml: ["deployment.yaml"]
    deploy:
      kubectl: {}
  - name: statefulset
    manifests:
      rawYaml: ["statefulset.yaml"]
    deploy:
      kubectl: {}
  - name: configconnector
    deploy:
      statusCheckDeadlineSeconds: 10
      kubectl: {}
    manifests:
      rawYaml: ["configconnector.yaml"]
  - name: pod
    manifests:
      rawYaml: ["pod.yaml"]
    deploy:
      kubectl: {}
