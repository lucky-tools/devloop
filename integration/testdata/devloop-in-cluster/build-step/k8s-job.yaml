apiVersion: v1
kind: Pod
metadata:
  name: devloop-in-cluster
spec:
    serviceAccountName: devloop-svc
    containers:
    - name: devloop-in-cluster
      image: devloop-in-cluster-builder
      command: ["/usr/bin/devloop"]
      args: ["build", "--cache-artifacts=false", "-p", "build-target", "-v", "debug"]
      imagePullPolicy: Always
    imagePullSecrets:
      - name: e2esecret
    restartPolicy: Never
