apiVersion: devloop/v1
kind: Config
build:
  artifacts:
  - image: us-central1-docker.pkg.dev/k8s-devloop/testing/main-config
deploy:
  kubectl:
    manifests:
    - k8s-*
profiles:
- name: oncluster
  build:
    artifacts:
    - image: us-central1-docker.pkg.dev/k8s-devloop/testing/main-config-pipeline
      context: .
      kaniko: {}
    tagPolicy:
      gitCommit: {}
    cluster:
      pullSecretName: kaniko-secret
