apiVersion: devloop/v1
kind: Config
build:
  tagPolicy:
    sha256: {}
  artifacts:
  - image: devloop-helm
manifests:
  helm:
    releases:
    - name: devloop-helm
      chartPath: devloop-helm
      setValueTemplates:
        image.repository: "{{.IMAGE_REPO_devloop_helm}}"
        image.tag: "{{.IMAGE_TAG_devloop_helm}}"
