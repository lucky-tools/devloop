apiVersion: devloop/v1
kind: Config
build:
  artifacts:
  - image: gcr.io/k8s-devloop/devloop-helm
manifests:
  helm:
    releases:
    - name: devloop-helm
      chartPath: charts
      setValueTemplates:
        image.repository: "{{.IMAGE_REPO_gcr_io_k8s_devloop_devloop_helm}}"
        image.tag: "{{.IMAGE_TAG_gcr_io_k8s_devloop_devloop_helm}}"
