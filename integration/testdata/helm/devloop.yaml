apiVersion: devloop/v1
kind: Config
build:
  tagPolicy:
    sha256: {}
  artifacts:
  - image: us-central1-docker.pkg.dev/k8s-devloop/testing/devloop-helm
manifests:
  helm:
    releases:
    # seed test namespace in the release name.
    - name: devloop-helm-{{.TEST_NS}}
      chartPath: devloop-helm
      #wait: true
      #valuesFiles:
      #- helm-devloop-values.yaml
profiles:
- name: helm-render
  manifests:
    helm:
      releases:
      # seed test namespace in the release name.
      - name: devloop-helm-{{.TEST_NS}}
        chartPath: devloop-helm
        setValues:
          pullPolicy: always
- name: helm-hook
  manifests:
    helm:
      releases:
        # seed test namespace in the release name.
        - name: devloop-helm-{{.TEST_NS}}
          chartPath: devloop-helm
      flags:
        install:
          - "--post-renderer=./change_replicas.py"
- name: helm-with-global-flags
  manifests:
    helm:
      flags:
        global:
          - "--debug"
      releases:
        # seed test namespace in the release name.
        - name: devloop-helm-{{.TEST_NS}}
          chartPath: devloop-helm
- name: helm-templating-charPath
  manifests:
    helm:
      releases:
        - name: devloop-helm
          chartPath: '{{.FOO}}'