apiVersion: devloop/v1
kind: Config
build:
  artifacts:
    - image: tolerance-check
      context: tolerance-check
      docker:
        buildArgs:
          STOP_FAILING_TIME: '{{.STOP_FAILING_TIME}}'
manifests:
  rawYaml:
    - tolerance-check/kubernetes/*
deploy:
  statusCheckDeadlineSeconds: 120
  kubectl: {}
